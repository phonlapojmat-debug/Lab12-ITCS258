name: lab10-backend-6688202
# Redis cache only. MySQL icthotel is the existing database configured in .env.
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6381:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
